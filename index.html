<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltForge IDE - Advanced Electronics Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #081410;
            color: #e0f2f1;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #081410;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a4d3c;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00ff9d;
        }

        /* Prevent text selection while dragging on canvas */
        .select-none {
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
